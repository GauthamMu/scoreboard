<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js"></script>
  </head>
  <body>
    <h1>Scoreboard</h1>
    <div class="outer">
      <div class="number left" onclick="incrementLeft()">
        <div class="digit-outer">
          <div class="digit-inner tens" id="leftTens">
            <div class="segment seg-u"></div>
            <div class="segment seg-ul"></div>
            <div class="segment seg-ur"></div>
            <div class="segment seg-c"></div>
            <div class="segment seg-bl"></div>
            <div class="segment seg-br"></div>
            <div class="segment seg-b"></div>
          </div>
        </div>
        <div class="digit-outer">
          <div class="digit-inner ones" id="leftOnes">
            <div class="segment seg-u"></div>
            <div class="segment seg-ul"></div>
            <div class="segment seg-ur"></div>
            <div class="segment seg-c"></div>
            <div class="segment seg-bl"></div>
            <div class="segment seg-br"></div>
            <div class="segment seg-b"></div>
          </div>
        </div>
      </div>
      <div class="divider">
        <div class="div-u"></div>
        <div class="div-b"></div>
      </div>
      <div class="number right" onclick="incrementRight()">
        <div class="digit-outer">
          <div class="digit-inner tens" id="rightTens">
            <div class="segment seg-u"></div>
            <div class="segment seg-ul"></div>
            <div class="segment seg-ur"></div>
            <div class="segment seg-c"></div>
            <div class="segment seg-bl"></div>
            <div class="segment seg-br"></div>
            <div class="segment seg-b"></div>
          </div>
        </div>
        <div class="digit-outer">
          <div class="digit-inner ones" id="rightOnes">
            <div class="segment seg-u"></div>
            <div class="segment seg-ul"></div>
            <div class="segment seg-ur"></div>
            <div class="segment seg-c"></div>
            <div class="segment seg-bl"></div>
            <div class="segment seg-br"></div>
            <div class="segment seg-b"></div>
          </div>
        </div>
      </div>
    </div>
    <button onclick="resetScoreboard()">Reset</button>
  </body>
</html>
